<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>신청이 접수되었습니다 — THE KOMATSU 90</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/variable/woff2/SUIT-Variable.css">
<style>
:root{--ink:#0E120E;--brass:#A5854A;--brass-l:#C9AE79;--moss:#8E958B;
  --sans:'SUIT Variable','SUIT',-apple-system,sans-serif;--lat:'Cormorant Garamond',serif}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:var(--ink);color:#fff;font-family:var(--sans);font-weight:300;
  display:grid;place-items:center;padding:32px;text-align:center;-webkit-font-smoothing:antialiased}
.brand{font-family:var(--lat);font-size:20px;letter-spacing:.3em;text-transform:uppercase;
  display:inline-flex;align-items:baseline;gap:.32em;margin-bottom:56px}
.brand sup{font-style:italic;font-size:.6em;color:var(--brass-l);position:relative;top:-.5em}
.mk{font-family:var(--lat);font-size:52px;color:var(--brass-l);line-height:1;margin:0 0 22px}
h1{font-size:clamp(23px,3vw,32px);font-weight:200;letter-spacing:-.035em;margin:0 0 18px}
p{color:rgba(255,255,255,.68);font-size:15px;line-height:1.9;margin:0 0 40px}
a{display:inline-block;border:1px solid rgba(255,255,255,.4);color:#fff;text-decoration:none;
  padding:15px 40px;font-family:var(--lat);font-size:13px;letter-spacing:.22em;text-transform:uppercase;transition:.35s}
a:hover{background:var(--brass);border-color:var(--brass);color:var(--ink)}
</style>
</head>
<body>
<div>
  <span class="brand">The Komatsu <sup>90</sup></span>
  <p class="mk">✓</p>
  <h1>신청이 접수되었습니다</h1>
  <p>남겨주신 연락처로 담당자가 영업일 기준 1일 이내에 연락드리겠습니다.<br>
     급하신 경우 <b style="color:#fff;font-weight:400">1660-3500</b> 으로 문의해 주세요.</p>
  <a href="/">메인으로 돌아가기</a>
</div>
</body>
</html>
